---
- name: Provision and deploy the chat application
  hosts: chat
  become: true


  vars:
    app_dir: /opt/chat-app
    repository_url: "https://github.com/Nizamuddin8053/chat.git"
    repository_branch: main


    frontend_origin: "{{ required_frontend_origin }}"
    mongodb_uri: "{{ required_mongodb_uri }}"
    jwt_secret: "{{ required_jwt_secret }}"

  tasks:

    - name: Wait for SSH connection
      ansible.builtin.wait_for_connection:
        timeout: 300
        delay: 5


    - name: Install required packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - git
          - docker.io
          - docker-compose-v2
        state: present
        update_cache: true

    - name: Enable Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Add ubuntu user to docker group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user}}"
        mode: "0755"


    - name: Check out the application
      ansible.builtin.git:
        repo: "{{ repository_url }}"
        version: "{{ repository_branch }}"
        dest: "{{ app_dir }}"
        force: true

    - name: Write production environment
      ansible.builtin.copy:
        dest: "{{ app_dir }}/.env"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0600"
        content: |
          MONGODB_URI={{ mongodb_uri }}
          JWT_SECRET={{ jwt_secret }}
          PORT=5001
          NODE_ENV=production
          FRONTEND_ORIGIN={{ frontend_origin }}
          FRONTEND_PORT=80

    - name: Stop old Compose stack
      ansible.builtin.command:
        cmd: docker compose down
        chdir: "{{ app_dir }}"
      failed_when: false


    - name: Build and start the Compose stack
      ansible.builtin.command:
        cmd: docker compose up -d --build --remove-orphans
        chdir: "{{ app_dir }}"

    - name: Wait for backend health endpoint
      ansible.builtin.uri:
        url: http://127.0.0.1:5001/health
        status_code: 200
      register: health_check
      retries: 30
      delay: 10
      until: health_check.status == 200


    - name: Display health status
      ansible.builtin.debug:
        msg: "Backend health check passed"



